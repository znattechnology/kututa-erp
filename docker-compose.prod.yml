# Produção genérica: Odoo + PostgreSQL. Cada cliente = uma base de dados (dbfilter por subdomínio).
#
# Uso:  cp .env.example .env   &&   docker compose -f docker-compose.prod.yml up -d --build
#
# Obrigatório à frente deste compose: um reverse proxy com TLS (nginx, Caddy ou Traefik) que encaminhe
#   /websocket  ->  odoo:8072   (bus/chat em modo multi-worker)
#   o resto     ->  odoo:8069
# As portas do Odoo só ficam expostas em 127.0.0.1. Ver docs/producao.md.

# Rotação de logs: sem tecto, o json-file do Docker cresce até encher o disco. 5 × 10 MB por serviço.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d postgres']
      interval: 10s
      timeout: 5s
      retries: 10

  odoo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    # As credenciais vão por variáveis de ambiente (lidas pelo libpq / Odoo), nunca na linha de comando.
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD}
    ports:
      - '127.0.0.1:8069:8069'
      - '127.0.0.1:8072:8072'
    volumes:
      - odoo-data:/var/lib/odoo

volumes:
  db-data:
  odoo-data:
