; Configuração de produção. Valores sensíveis vêm de variáveis de ambiente no docker-compose.prod.yml
; (o odoo-bin aceita --db_host, --db_password, etc. via "command").
[options]
addons_path = /opt/odoo/addons,/opt/odoo/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
proxy_mode = True
list_db = False
dbfilter = ^%d$
workers = 4
max_cron_threads = 2
limit_time_cpu = 600
limit_time_real = 1200
log_level = info
without_demo = True
