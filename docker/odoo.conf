; Configuração de produção. As credenciais da base de dados vêm das variáveis PGHOST/PGUSER/PGPASSWORD
; e a password mestra de ODOO_MASTER_PASSWORD (ver docker/entrypoint.sh).
[options]
addons_path = /opt/odoo/addons,/opt/odoo/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
proxy_mode = True
list_db = False
dbfilter = ^%d$
; O Odoo 20 escuta em 127.0.0.1 por defeito; no container tem de ouvir em todas as interfaces (no anfitrião
; as portas só ficam em 127.0.0.1, ver docker-compose.prod.yml).
http_interface = 0.0.0.0
workers = 4
max_cron_threads = 2
gevent_port = 8072
limit_time_cpu = 600
limit_time_real = 1200
log_level = info
